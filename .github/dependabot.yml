# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # NuGet dependencies for all C# backend projects (glob captures any new projects automatically)
  - package-ecosystem: "nuget"
    directories:
      - "/backend/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "dylan-smith"
    labels:
      - "dependencies"
      - "backend"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "dylan-smith"
    labels:
      - "dependencies"

  # npm dependencies for the frontend
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "dylan-smith"
    labels:
      - "dependencies"
      - "frontend"
